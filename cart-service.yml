spring:
  application:
    name: cart-service  
  datasource:
    url: jdbc:mysql://localhost:3306/cart_db
    username: root
    password: "@Bluemoon257"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: "http://localhost:5173"
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"