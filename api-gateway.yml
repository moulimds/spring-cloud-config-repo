spring:
  application:
    name: auth-service
  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - "*"

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            - id: profile-service
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/api/v1/profiles/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**

            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/api/v1/search/**

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/v1/cart/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**

            - id: wishlist-service
              uri: lb://WISHLIST-SERVICE
              predicates:
                - Path=/wishlist/**

            - id: coupon-service
              uri: lb://COUPON-SERVICE
              predicates:
                - Path=/coupons/**

            - id: wallet-service
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/wallets/**

            - id: shipping-service
              uri: lb://SHIPPING-SERVICE
              predicates:
                - Path=/api/v1/shipments/**

            - id: delivery-agent-service
              uri: lb://delivery-agent-service
              predicates:
                - Path=/api/v1/delivery-agents/**

            - id: invoice-service
              uri: lb://invoice-service
              predicates:
                - Path=/api/v1/invoices/**

            - id: review-service
              uri: lb://REVIEW-SERVICE
              predicates:
                - Path=/api/v1/reviews/**

            - id: recommendation-service
              uri: lb://RECOMMENDATION-SERVICE
              predicates:
                - Path=/api/v1/recommendations/**

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: gateway,health,info,env