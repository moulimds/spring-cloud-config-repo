      maximum-pool-size: 5
      minimum-idle: 2

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8098

management:
  endpoints:
    web:
      exposure:
        include: health,info